name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if sudo timeout 90 apt-get update \
              && sudo timeout 120 apt-get install -y pkg-config liblzma-dev libbz2-dev poppler-utils pandoc; then
              exit 0
            fi
            echo "apt attempt $i failed, retrying..."
            sleep 10
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --color=always 2>&1 | tee cargo-test.log
      - name: Publish cargo test lints
        if: failure()
        run: |
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("cargo-test.log")
          if not p.exists():
              raise SystemExit(0)
          t = re.sub(r"\x1b\[[0-9;]*m", "", p.read_text(errors="replace"))
          keys = ("error:", "--> ", "FAILED", "panicked", "assertion")
          hits = [ln[:240] for ln in t.splitlines() if any(k in ln for k in keys)]
          for ln in (hits[-40:] or t.splitlines()[-30:]):
              print("::error::" + ln)
          PY
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --color=always -- -D warnings 2>&1 | tee cargo-clippy.log
      - name: Publish clippy lints
        if: failure()
        run: |
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("cargo-clippy.log")
          if not p.exists():
              raise SystemExit(0)
          t = re.sub(r"\x1b\[[0-9;]*m", "", p.read_text(errors="replace"))
          hits = [ln[:220] for ln in t.splitlines() if "error:" in ln or "warning:" in ln or "--> " in ln]
          for ln in hits[-60:]:
              print("::error::" + ln)
          PY

  # x86_64 only. No Windows ARM.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --color=always
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --color=always -- -D warnings 2>&1 | tee cargo-clippy.log
      - name: Publish clippy lints
        if: failure()
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("cargo-clippy.log")
          if not p.exists():
              raise SystemExit(0)
          t = re.sub(r"\x1b\[[0-9;]*m", "", p.read_text(errors="replace"))
          hits = [ln[:220] for ln in t.splitlines() if "error:" in ln or "warning:" in ln or "--> " in ln]
          for ln in hits[-60:]:
              print("::error::" + ln)
          PY
