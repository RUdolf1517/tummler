name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Typst/hayro (feature slides) is release-only; compiling it made CI ~15 min.
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --no-default-features --color=always 2>&1 | tee cargo-test.log
      - name: Publish cargo test lints
        if: failure()
        run: python3 -c '
          import pathlib,re
          t=re.sub(r"\x1b\[[0-9;]*m","",pathlib.Path("cargo-test.log").read_text(errors="replace"))
          hits=[ln[:200] for ln in t.splitlines() if "error:" in ln or "--> " in ln]
          for ln in (hits[-40:] or t.splitlines()[-20:]):
              print("::error::"+ln)
          '
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --no-default-features --all-targets --color=always -- -D warnings 2>&1 | tee cargo-clippy.log
      - name: Publish clippy lints
        if: failure()
        run: python3 -c '
          import pathlib,re
          t=re.sub(r"\x1b\[[0-9;]*m","",pathlib.Path("cargo-clippy.log").read_text(errors="replace"))
          hits=[ln[:220] for ln in t.splitlines() if "error:" in ln or "warning:" in ln or "--> " in ln]
          for ln in hits[-60:]:
              print("::error::"+ln)
          '
