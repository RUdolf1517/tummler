name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Typst/hayro (feature slides) is release-only; compiling it made CI ~15 min.
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --no-default-features --color=always 2>&1 | tee cargo-test.log
      - name: Publish cargo test tail
        if: failure()
        run: |
          tail -n 40 cargo-test.log | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --no-default-features --all-targets --color=always -- -D warnings 2>&1 | tee cargo-clippy.log
      - name: Publish clippy tail
        if: failure()
        run: |
          tail -n 40 cargo-clippy.log | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
