name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test
      - name: cargo build
        run: cargo build
      - name: cargo clippy
        run: cargo clippy -- -D warnings
