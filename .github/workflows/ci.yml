name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test
      - name: cargo build
        run: cargo build
      - name: cargo clippy
        run: cargo clippy -- -D warnings || true
