name: ci

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test
      - name: cargo build
        run: cargo build
      - name: cargo clippy
        run: cargo clippy -- -D warnings
