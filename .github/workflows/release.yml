name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tummler-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tummler-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tummler-aarch64-apple-darwin.tar.gz
          # Cross-compile from Apple Silicon; rustc targets x86_64-apple-darwin.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tummler-x86_64-apple-darwin.tar.gz
          # Windows x64 only. No ARM.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tummler-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v5

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if sudo timeout 90 apt-get update \
              && sudo timeout 120 apt-get install -y pkg-config liblzma-dev libbz2-dev; then
              exit 0
            fi
            echo "apt attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} tummler
          shasum -a 256 ../../../${{ matrix.archive }} | tee ../../../${{ matrix.archive }}.sha256

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/tummler.exe"
          $out = "${{ matrix.archive }}"
          Compress-Archive -Path $exe -DestinationPath $out -Force
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$hash  $out" | Tee-Object -FilePath "$out.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Linux .deb / .rpm
        run: bash packaging/linux-packages.sh "${GITHUB_REF_NAME#v}" dist man/tummler.1

      - name: Hashes
        run: |
          mkdir -p dist
          {
            echo "### SHA-256"
            echo
            echo '```'
            (cd dist && for f in *.tar.gz *.deb *.rpm *.zip; do
              [ -f "$f" ] || continue
              sha256sum -- "$f"
            done)
            echo '```'
          } | tee hashes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: hashes.md
          generate_release_notes: true
          fail_on_unmatched_files: false

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: benchmark-${{ matrix.target.triple }}-${{ matrix.profile.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-latest, triple: aarch64-apple-darwin, native: true }
          - { os: macos-latest, triple: x86_64-apple-darwin, native: false }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, native: true }
        profile:
          - { name: fat-o3, lto: fat, opt: 3 }
          - { name: thin-o3, lto: thin, opt: 3 }
          - { name: fat-oz, lto: fat, opt: "z" }
          - { name: thin-oz, lto: thin, opt: "z" }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 45
    env:
      BENCH_TARGET: ${{ matrix.target.triple }}
      BENCH_NATIVE: ${{ matrix.target.native }}
      BENCH_PROFILE: ${{ matrix.profile.name }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.profile.lto }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.profile.opt }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-benchmark-${{ matrix.target.triple }}-${{ matrix.profile.name }}
      - name: Build and measure
        run: python3 .github/scripts/benchmark-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.target.triple }}-${{ matrix.profile.name }}
          path: benchmark.json
