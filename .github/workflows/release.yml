name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tummler-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tummler-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tummler-aarch64-apple-darwin.tar.gz
          # Cross-compile from Apple Silicon; rustc targets x86_64-apple-darwin.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tummler-x86_64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} tummler
          shasum -a 256 ../../../${{ matrix.archive }} | tee ../../../${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: Hashes
        run: |
          mkdir -p dist
          {
            echo "### SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *.tar.gz 2>/dev/null) || true
            echo '```'
          } | tee hashes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: hashes.md
          generate_release_notes: true
          fail_on_unmatched_files: false

  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev poppler-utils pandoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
