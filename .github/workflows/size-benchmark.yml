name: release-profile-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.target }} / ${{ matrix.profile.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-latest, triple: aarch64-apple-darwin, native: true }
          - { os: macos-latest, triple: x86_64-apple-darwin, native: false }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, native: true }
        profile:
          - { name: fat-o3, lto: fat, opt: 3 }
          - { name: thin-o3, lto: thin, opt: 3 }
          - { name: fat-oz, lto: fat, opt: "z" }
          - { name: thin-oz, lto: thin, opt: "z" }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 45
    env:
      BENCH_TARGET: ${{ matrix.target.triple }}
      BENCH_NATIVE: ${{ matrix.target.native }}
      BENCH_PROFILE: ${{ matrix.profile.name }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.profile.lto }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.profile.opt }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-benchmark-${{ matrix.target.triple }}-${{ matrix.profile.name }}
      - name: Build and measure
        run: python3 .github/scripts/benchmark-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.target.triple }}-${{ matrix.profile.name }}
          path: benchmark.json
