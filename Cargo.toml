[package]
name = "tummler"
version = "0.3.1"
edition = "2024"
description = "One CLI that mixes any file into any format — images, video, documents, spreadsheets, archives"
authors = ["RUdolf1517 <rudolfzinovev@protonmail.com>"]
license = "MIT"
repository = "https://github.com/RUdolf1517/tummler"
homepage = "https://github.com/RUdolf1517/tummler"
readme = "README.md"
keywords = ["cli", "converter", "ffmpeg", "image", "transcode"]
categories = ["command-line-utilities", "multimedia"]
rust-version = "1.99"

[[bin]]
name = "tummler"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.5"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "rayon"] }
jpeg-decoder = { version = "0.3", default-features = false, features = ["rayon"] }
resvg = "0.48"
walkdir = "2.5"
which = "6.0"
colored = "2.1"
indicatif = { version = "0.17", default-features = false, features = ["unicode-width", "unicode-segmentation"] }
dialoguer = { version = "0.11", default-features = false }
rayon = "1.10"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "xz", "zstd"] }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }
tempfile = "3.10"
ctrlc = "3.4"
libc = "0.2"
calamine = "0.37"
csv = "1.3"
rust_xlsxwriter = { version = "0.100", features = ["zmij"] }

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
incremental = false

[profile.dev]
opt-level = 0
